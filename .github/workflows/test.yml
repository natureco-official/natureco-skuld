name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript and lint checks
        run: npm run lint:errors-only

      # `tsc --build` hem tip kontrolü yapar hem `packages/*/dist` üretir.
      # SIRA ÖNEMLİ: `src/utils/gateway.js` kapıyı `dist`ten yüklüyor, yani
      # derleme olmadan paket testleri `ERR_MODULE_NOT_FOUND` ile düşer.
      # Yerelde `dist` zaten duruyordu ve bu bağımlılık görünmüyordu; temiz
      # checkout'ta görünür — CI'ın işi tam olarak bu.
      - name: Typecheck and build packages
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test -- --reporter=dot

      # Skuld'a özgü değişmezler. Bunlar CI'da koşmazsa yalnızca birinin
      # elle çalıştırmayı hatırladığı zaman koşarlar — yani bir süre sonra
      # hiç koşmazlar.
      - name: Package tests (gateway, memory, quality gate)
        run: npm run test:paketler

      - name: Boundary, provenance and help-text gates
        run: npm run kapilar

      - name: Capability audit
        run: npm run yetenekler

      # Testlerin düzeltmeleri gerçekten sabitlediğini doğrular: her düzeltmeyi
      # tek tek geri alır, testin kırıldığını görür, dosyayı geri yükler.
      # Codex denetimi beş testin düzeltme geri alındığında yeşil kaldığını
      # gösterdiği için eklendi — yeşil bir süit, korunan bir davranış demek
      # değil.
      - name: Mutation check (security fixes are pinned)
        run: npm run mutasyon

      - name: CLI smoke test
        run: npm run smoke

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Verify publish package
        run: npm pack --dry-run
